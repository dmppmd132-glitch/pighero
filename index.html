function claimQ(id){const q=SQ.find(x=>x.id===id),s=p.w.q[id];if(!q||!s||!s.d||s.s!==1)return;s.s=2;p.gold+=q.g;p.xp+=q.x;let t=`🎉 任務完成：${q.nm}！獲得 ${q.g} G、${q.x} EXP`;if(q.pot){p.potions+=q.pot;t+=`、藥水 ×${q.pot}`}if(q.sp){p.skillPoints=(p.skillPoints||0)+q.sp;t+=`、技能點數 +${q.sp}`}t+="。"+(q.e?rollDrop(q.e):"");const l0=p.lv;while(p.xp>=p.next)levelUp();if(p.lv>l0)t+=`\n✨ 升級了！現在是 Lv.${p.lv}。`;hud();say(t);addLog("完成任務："+q.nm);buttons([["回任務板",questBoard]])}

function guardCount(){return p.s&&p.s.guards?Object.keys(p.s.guards).length:0}
function gemB(st){let t=0;if(p&&p.s&&p.s.gems){for(const k in p.s.gems)if(GEM[k]&&GEM[k].st===st)t+=GEM[k].v;if(gemCount()>=7)t+=GEM_SET[st]||0}return t}
function titleTxt(){return p.s&&p.s.title?"｜稱號 "+p.s.title+(p.s.ng?"｜周目 "+(p.s.ng+1):""):(p.s&&p.s.ng?"｜周目 "+(p.s.ng+1):"")}

function objective(){const s=p.s,g=gemCount();if(!s.pro&&!g)return"與村長交談，完成「史萊姆騷動」任務。";if(g<7){const i=AREAS.findIndex((a,k)=>k<7&&!s.gems[k]);return`收集勇者寶石（${g}/7）。下一個目標：${AREAS[i].n}的${BOSSES[i].n}（建議 Lv.${AREAS[i].lv}）。`}if(guardCount()<3)return`七顆寶石已齊！前往深淵魔王城（Lv.28），擊敗三位守將（${guardCount()}/3）。`;if(!s.end)return"王座結界已解除，挑戰深淵魔王，結束這場千年的戰爭！";return`已通關（結局：${END_N[s.end]}）。可開啟二周目挑戰更強的敵人。`}

function giveClear(id){ensureEq();const s=p.s,first=!s.cleared;s.end=id;s.endings[id]=1;s.cleared=1;s.clears=(s.clears||0)+1;let t="🏆 通關獎勵\n";if(first){p.gold+=20000;p.skillPoints=(p.skillPoints||0)+5;t+="・金幣 +20000、技能點數 +5\n・傳說裝備：勇者聖劍、勇者之鎧、勇者徽章";for(const b of CLEAR_ITEMS){const it=newItem(b,3);if(p.inv.length<BAG_MAX)p.inv.push(it);else p.gold+=sellPrice(it)}}else{const g=5000*(s.ng+1);p.gold+=g;p.skillPoints=(p.skillPoints||0)+2;t+=`・金幣 +${g}、技能點數 +2`}if(!s.title||END_R[id]>=END_R[Object.keys(END_T).find(k=>END_T[k]===s.title)||"normal"]){s.title=END_T[id];t+=`\n・稱號「${s.title}」`}hud();addLog("通關！結局："+END_N[id]);return t}
function credits(rw){ensureEq();const s=p.s;say(`🎊 恭喜通關！\n結局：${END_N[s.end]}\n${rw||""}\n\n波波 Lv.${p.lv}｜${p.job}｜寶石 ${gemCount()}/7\n支線 ${SQ.filter(q=>p.w.q[q.id]&&p.w.q[q.id].s===2).length}/${SQ.length}｜夥伴 ${Object.keys(p.comp).length}/8｜寵物 ${Object.keys(p.pets).length}/7\n已達成結局：${Object.keys(s.endings).map(k=>END_N[k]).join("、")}\n\n感謝遊玩《豬豬勇者傳說》！`);$("location").textContent="🎊 通關";buttons([["🔁 開啟二周目（傳說周目）",startNgPlus],["繼續探索世界",townHome]])}
function startNgPlus(){ensureEq();const s=p.s;if(!s.end){say("需要先通關才能開啟二周目。");return}if(!confirm("開啟二周目？\n・怪物變強（每周目 +50% 能力與獎勵）\n・寶石、BOSS、守將會重置\n・等級、裝備、夥伴、寵物、任務進度全部保留"))return;s.ng++;s.gems={};s.guards={};s.end=null;s.seen.castle=0;s.seen.throne=0;p.bosses={};p.area=0;p.loc=0;refreshEquip();addLog("開啟第 "+(s.ng+1)+" 周目");townMenu();say(`🔁 第 ${s.ng+1} 周目開始！黑暗再度籠罩世界，七顆寶石化為星光重新散落……\n怪物能力與獎勵 ×${1+.5*s.ng}。`)}
function say(t){$("message").textContent=t}
function addLog(t){log.unshift(t);$("log").innerHTML=log.slice(0,5).map(x=>"・"+x).join("<br>")}
function hud(){$("hud").innerHTML=`<span class="stat">🐷 ${p.name}｜${p.job} Lv.${p.lv}</span><span class="stat">❤️ HP ${p.hp}/${p.maxHp}<div class="bar"><i style="width:${p.hp/p.maxHp*100}%"></i></div></span><span class="stat">💧 MP ${p.mp}/${p.maxMp}</span><span class="stat">⭐ EXP ${p.xp}/${p.next}</span><span class="stat">🪙 ${p.gold} G</span><span class="stat">🧪 藥水 ${p.potions}</span>${stHud()}`}
function buttons(items){$("actions").innerHTML="";items.forEach(([label,fn,cls])=>{let b=document.createElement("button");b.textContent=label;b.className=cls||"";b.onclick=fn;$("actions").appendChild(b)})}
function talk(){if(inBattle)return;ensureEq();const s=p.s;if(s.pro){say(`村長：「${objective()}」`);buttons([["接取史萊姆討伐（可重複）",slimeQuest],["📖 主線進度",storyLog],["離開",townMenu]]);return}if(quest&&won){say("村長：你是村莊的英雄！收下這份獎勵吧。");p.gold+=30;won=false;quest=false;addLog("任務獎勵：30 金幣");hud();buttons([["▶ 繼續",()=>scene("pro",()=>{s.pro=1;townHome()})]]);return}slimeQuest()}
function slimeQuest(){if(inBattle)return;if(!quest){quest=true;p.kills=0;say("村長：勇敢的小豬啊！村外的史萊姆最近搗蛋不休。請打敗 3 隻史萊姆，保護村莊！完成後我會給你 30 金幣。");addLog("接下任務：擊敗 3 隻史萊姆。")}else if(!won){say("村長：拜託你了！村外有史萊姆出沒，累積打敗 3 隻就能完成任務。")}else{say("村長：你是村莊的英雄！收下這份獎勵吧。");p.gold+=30;won=false;quest=false;addLog("任務獎勵：30 金幣");hud()}buttons([["繼續冒險",explore],["查看狀態",showStatus]])}
function explore(){if(inBattle)return;ensureEq();if(p.hp<=0){say("你需要先恢復體力。");buttons([["使用藥水",usePotion],["回城鎮休息",rest]]);return}const a=p.area||0,reg=REG[a];let k=p.loc||0,ty=reg.L[k][1];if(ty==="town"){k=reg.L.findIndex(l=>l[1]!=="town"&&l[1]!=="hidden");p.loc=k;ty=reg.L[k][1]}if(ty==="hidden")ty="cave";const r=Math.random(),[pb,pg]={field:[.75,0],forest:[.55,.3],cave:[.65,.25]}[ty];eliteP=ty==="cave"?.2:.12;$("location").textContent=reg.L[k][0];if(r<pb){startBattle();return}let t;if(r<pb+pg){const mat=ty==="forest"?"herb":"ore";p.w.mats[mat]=(p.w.mats[mat]||0)+1;t=`你在${reg.L[k][0]}採集到 ${mat==="herb"?"🌿 藥草":"⛏️ 礦石"} ×1。`+questHook("gather",a)}else{const g=Math.max(3,Math.round(AREA_G[a]*(.8+Math.random()*.6)));p.gold+=g;t=`你在${reg.L[k][0]}找到 ${g} 枚金幣！`}addLog(t.split("\n")[0]);hud();say(t);buttons([["繼續探索",explore],["🔍 搜索",search],["回城鎮",village]])}
function village(){inBattle=false;$("scene").classList.remove("battle");$("enemy")?.remove();ensureEq();p.loc=0;townMenu()}
function startBattle(boss){ensureEq();inBattle=true;turn="player";pst={};est={};imm={p:false,e:false};preMsg="";const a=boss!=null?boss:(p.area||0);enemy=makeEnemy(a,boss!=null);bt={allies:buildAllies(),sh:1,buf:0};if(bt.allies.length)enemy.maxHp=enemy.hp=Math.round(enemy.maxHp*(1+.4*bt.allies.length));$("scene").classList.add("battle");$("hero").textContent="🐷⚔️";$("enemy")?.remove();const e=document.createElement("div");e.id="enemy";e.className="enemy"+(enemy.kind==="boss"?" boss":"");e.textContent=enemy.emoji;$("scene").appendChild(e);updEnemy();const w=BEAT[jobEl()]===enemy.el?"你的屬性剋制對方！":BEAT[enemy.el]===jobEl()?"對方屬性剋制你，小心！":"";say(`${enemy.kind==="boss"?"👑 BOSS 登場！":enemy.kind==="elite"?"⭐ 精英怪出現了！":"野生的"}${enemy.name}（${EL[enemy.el][1]}${EL[enemy.el][0]}屬性，HP ${enemy.maxHp}）！\n你的屬性：${EL[jobEl()][1]}${EL[jobEl()][0]}。${w}${teamLine()}`);addLog("遭遇"+enemy.name);battleButtons();hud()}
function battleButtons(){const j=JOBS[p.jobKey]||JOBS.knight;let opts=[["⚔️ 普通攻擊",attack],[`✨ ${j.skill}（${j.cost} MP）`,skill]];const learned=Object.keys(p.learnedSkills||{}).filter(k=>p.learnedSkills[k]&&k.startsWith(p.jobKey+":"));learned.filter(k=>{const s=SKILL_TREES[p.jobKey].find(x=>x[0]===k.split(":")[1]);return s&&s[1]==="active"&&s[0]!==j.skill}).slice(0,3).forEach(k=>{const s=SKILL_TREES[p.jobKey].find(x=>x[0]===k.split(":")[1]);opts.push([`✨ ${s[0]}（${s[2]} MP）`,()=>useTreeSkill(s[0])])});opts.push(["🛡️ 防禦",defend],["🧪 使用藥水",usePotion],["🏃 逃跑",runAway]);buttons(opts)}
function attack(){if(!inBattle||turn!=="player")return;const r=hitEnemy(patk()+Math.floor(Math.random()*4)-1,null);afterPlayer(`波波使出普通攻擊，對${enemy.name}造成 ${r.d} 點傷害！`);addLog(`普通攻擊：${r.d} 傷害`)}
function skill(){if(!inBattle||turn!=="player")return;const j=JOBS[p.jobKey]||JOBS.knight;if(pst.silence>0){say("🔇 沉默中，無法使用技能！");return}if(p.mp<j.cost){say("MP 不足！");return}p.mp-=j.cost;if(j.kind==="heal"){const amount=Math.round(p.maxHp*j.power*(passiveLearned()?1.3:1)),healed=Math.min(amount,p.maxHp-p.hp);p.hp+=healed;const m=`波波施展 ${j.skill}，恢復 ${healed} HP！`;say(m);addLog(`${j.skill}：恢復 ${healed} HP`);hud();enemyTurn(false,m);return}const el=skEl(j.skill),r=hitEnemy(patk()*j.power+Math.random()*5,el);afterPlayer(`波波使出 ${j.skill}（${EL[el][1]}）！造成 ${r.d} 點傷害！${elTag(r.m)}${pStatus(el)}`);addLog(`${j.skill}：${r.d} 傷害`)}
function defend(){if(!inBattle||turn!=="player")return;say("波波架起防禦姿勢，準備承受攻擊！");enemyTurn(true,"🛡️ 波波架起防禦姿勢！")}
function afterPlayer(msg){hud();updEnemy();say(msg);if(enemy.hp<=0){preMsg=msg;victory();return}enemyTurn(false,msg)}
function enemyTurn(block,pre){turn="enemy";const pr=pre?pre+"\n":"";setTimeout(()=>{if(!inBattle||!enemy)return;const m=[],bm=enemy.kind==="boss"?.5:1;m.push(...allyPhase());if(enemy.hp<=0){tick(est);preMsg=pr+m.join("\n");updEnemy();victory();return}for(const k of["poison","burn"])if(est[k]>0){const d=Math.max(1,Math.round(enemy.maxHp*(k==="poison"?.06:.07)*bm));enemy.hp-=d;m.push(`${ST[k][1]}${enemy.name}受到${ST[k][0]}，損失 ${d} HP`)}if(enemy.hp<=0){tick(est);preMsg=pr+m.join("\n");updEnemy();victory();return}let skip=false;if(est.freeze>0){skip=true;m.push(`🧊 ${enemy.name}被冰凍，無法行動！`)}else if(est.paralyze>0&&Math.random()<.5){skip=true;m.push(`⚡ ${enemy.name}麻痺，動彈不得！`)}imm.e=skip;tick(est);if(!skip)m.push(enemyAct(block));if(bt.buf>0)bt.buf--;updEnemy();hud();addLog(m[m.length-1]);const text=pr+m.join("\n");if(p.hp<=0)faint(text);else playerStart(text)},650)}
function victory(){inBattle=false;const e=enemy;enemy=null;pst={};est={};p.xp+=e.xp;p.gold+=e.gold;$("scene").classList.remove("battle");$("enemy")?.remove();$("hero").textContent="🐷";$("location").textContent=AREAS[p.area||0].n;let text=(preMsg?preMsg+"\n":"")+`勝利！擊敗${e.name}，獲得 ${e.xp} EXP、${e.gold} 金幣。`;preMsg="";if(e.kind==="boss"&&e.guard==null&&!(p.bosses=p.bosses||{})[e.area]){p.bosses[e.area]=true;e.first=1;p.gold+=e.gold*2;text+=` 🏆 首次擊敗 BOSS，額外獲得 ${e.gold*2} 金幣！`}if(quest){p.kills=(p.kills||0)+1;text+=` 任務進度 ${p.kills}/3。`;if(p.kills>=3){won=true;text+=" 任務完成！回村找村長領取獎勵。"}}text+=bondGain(e)+rollDrop(e.kind)+questHook("kill",e.area)+(e.kind==="boss"&&e.guard==null?questHook("boss",e.area):"");const lv0=p.lv;while(p.xp>=p.next)levelUp();say(text+(p.lv>lv0?`\n✨ 升級了！現在是 Lv.${p.lv}，獲得技能點數。`:""));addLog("擊敗 "+e.name);hud();if(storyAfter(e))return;buttons([["繼續探索",explore],["地圖與 BOSS",areaMenu],["回村休息",village]])}
function levelUp(){p.xp-=p.next;p.lv++;p.next=Math.floor(p.next*1.45+8);p.skillPoints=(p.skillPoints||0)+1;applyJob(p.jobKey||"knight",true);p.hp=p.maxHp;p.mp=p.maxMp;say("✨ 升級了！波波現在 Lv."+p.lv+"！能力值提升，獲得 1 點技能點數。");addLog("升級！技能點數 +1；目前 Lv."+p.lv)}
function usePotion(){if(inBattle&&turn!=="player")return;if(p.potions<=0){say("沒有藥水了！");return}const sick=pst.poison>0||pst.burn>0;if(p.hp===p.maxHp&&!sick){say("HP 已經是滿的！");return}p.potions--;const heal=Math.min(Math.max(20,Math.round(p.maxHp*.3)),p.maxHp-p.hp);p.hp+=heal;delete pst.poison;delete pst.burn;const m=`使用藥水，恢復 ${heal} HP${sick?"，並解除中毒／燃燒":""}。`;say(m);hud();if(inBattle)enemyTurn(false,m);else buttons([["繼續",explore],["回村",village]])}
function runAway(){if(!inBattle||turn!=="player")return;if(enemy&&enemy.kind==="boss"){say("BOSS 戰無法逃跑！");return}if(Math.random()<.75){inBattle=false;enemy=null;pst={};est={};$("scene").classList.remove("battle");$("enemy")?.remove();$("hero").textContent="🐷";$("location").textContent=AREAS[p.area||0].n;say("成功逃離戰鬥！");buttons([["繼續探索",explore],["回村",village]])}else{say("逃跑失敗！");enemyTurn(false,"🏃 逃跑失敗！")}}
function rest(){if(inBattle)return;ensureEq();const c=restCost();if(p.gold<c){say(`旅店住宿需要 ${c} G，金幣不足。可以使用藥水，或回波波新手村免費休息。`);buttons([["返回",townMenu]]);return}p.gold-=c;p.talked={};p.hp=p.maxHp;p.mp=p.maxMp;say(`在旅店休息後，HP 和 MP 完全恢復！${c?"（花費 "+c+" G）":""}`);hud();buttons([["前往野外",explore],["返回城鎮",townMenu]])}

HP ${p.hp}/${p.maxHp}　MP ${p.mp}/${p.maxMp}

隊伍：${partyText()}
目前任務：${quest?"擊敗 3 隻史萊姆（"+(p.kills||0)+"/3）":"尚未接取"}`);buttons([["裝備與背包",equipMenu],["職業選擇",jobMenu],["進階轉職",promotionMenu],["技能樹",skillMenu],["繼續探索",explore],["回村",village]])}
function jobMenu(){if(inBattle)return;say("選擇你的職業。轉職會改變能力值與專屬戰鬥技能，保留目前等級與經驗。");buttons(Object.entries(JOBS).map(([key,j])=>[`${j.name}｜HP ${j.hp} MP ${j.mp} ATK ${j.atk} DEF ${j.def}`,()=>chooseJob(key)]).concat([["返回角色狀態",showStatus]]))}
function chooseJob(key){const j=JOBS[key];if(!j)return;p.promotionKey=null;applyJob(key);say(`轉職成功！波波現在是「${j.name}」。${j.desc}專屬技能：${j.skill}（${j.cost} MP）。`);addLog("轉職為 "+j.name);hud();buttons([["查看技能樹",skillMenu],["查看狀態",showStatus],["回村",village]])}
function promotionMenu(){if(inBattle)return;const key=p.jobKey||"knight",list=PROMOTIONS[key]||[];const options=list.map(x=>[`${x[0]}｜${x[3]}（Lv.10、3 技能點）`,()=>promoteTo(x[0])]);say(`【進階轉職】目前職業：${JOBS[key].name}${p.promotionKey?" → "+p.promotionKey:""}\n需求：角色 Lv.10、至少 3 技能點。轉職會永久強化能力，並保留原職業技能樹。`);if(p.promotionKey)options.unshift(["已完成進階轉職",()=>promotionMenu()]);options.push(["返回角色狀態",showStatus]);buttons(options)}
function promoteTo(name){const key=p.jobKey||"knight",choice=(PROMOTIONS[key]||[]).find(x=>x[0]===name);if(!choice)return;if(p.lv<10){say("角色尚未達到 Lv.10，暫時不能進階轉職。");buttons([["返回",promotionMenu]]);return}if((p.skillPoints||0)<3){say("技能點數不足，需要 3 點技能點。");buttons([["返回",promotionMenu]]);return}if(p.promotionKey){say("已經完成進階轉職。若要選擇其他發展路線，請先回到基礎職業。");buttons([["返回",promotionMenu]]);return}p.skillPoints-=3;p.promotionKey=name;applyJob(key);say(`進階轉職成功！波波成為「${name}」！\n${choice[3]}\n能力值已強化，原職業技能樹仍可使用。`);addLog("進階轉職："+name);hud();buttons([["查看角色狀態",showStatus],["查看技能樹",skillMenu],["回村",village]])}
function skillMenu(){const key=p.jobKey||"knight",j=JOBS[key],tree=SKILL_TREES[key],learned=p.learnedSkills||{};let lines=tree.map((s,i)=>`${i+1}. ${s[0]}【${s[1]==="active"?"主動":"被動"}】${learned[key+":"+s[0]]?"✓ 已學習":"— 需技能點 1"}`).join("\n");say(`【${j.name}技能樹】\n技能點數：${p.skillPoints||0}\n${lines}\n\n選擇未學習技能即可解鎖。`);let opts=[];tree.forEach(s=>{if(!learned[key+":"+s[0]])opts.push([`學習 ${s[0]}（1 點）`,()=>learnTreeSkill(s[0])])});opts.push(["切換職業",jobMenu],["返回狀態",showStatus]);buttons(opts)}
function learnTreeSkill(name){const key=p.jobKey||"knight",s=SKILL_TREES[key].find(x=>x[0]===name);if(!s)return;if((p.skillPoints||0)<1){say("技能點數不足！升級可以獲得技能點數。");buttons([["返回技能樹",skillMenu]]);return}p.skillPoints--;p.learnedSkills=p.learnedSkills||{};p.learnedSkills[key+":"+name]=true;if(s[1]==="passive")refreshEquip();addLog("習得技能："+name);hud();skillMenu()}
function learnPassive(){const key=p.jobKey||"knight",name=JOBS[key].passive;if((p.skillPoints||0)<1){say("技能點數不足！升級可以獲得技能點數。");buttons([["返回技能樹",skillMenu]]);return}p.learnedPassives=p.learnedPassives||{};if(p.learnedPassives[key]){skillMenu();return}p.skillPoints--;p.learnedPassives[key]=true;addLog("習得被動："+name);hud();skillMenu()}

g8Settings=function(){g8oSet();if(inBattle)return;const b=document.createElement("button");b.className="secondary";b.textContent=g8pwa?"📲 安裝遊戲":"📲 如何安裝";b.onclick=()=>{if(g8pwa){g8pwa.prompt();g8pwa=null}else{say("【📲 安裝遊戲】\n・iPhone／iPad：用 Safari 點「分享」→「加入主畫面」。\n・Android／電腦：用 Chrome 或 Edge，從網址列的安裝圖示或選單安裝。\n已安裝，或此瀏覽器不支援時，不會出現安裝提示。");buttons([["返回設定",g8Settings]])}};$("actions").appendChild(b)};
function g8updateBanner(){if(document.getElementById("g8upd"))return;const d=document.createElement("div");d.id="g8upd";d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:60;background:#49372e;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px #0006";d.innerHTML='<span>🎉 有新版本！建議先存檔再更新</span>';const b=document.createElement("button");b.textContent="立即更新";b.onclick=()=>location.reload();const x=document.createElement("button");x.textContent="稍後";x.className="secondary";x.onclick=()=>d.remove();d.appendChild(b);d.appendChild(x);document.body.appendChild(d)}

/* ===== 畫面改善：技能樹（六角蜂巢）與背包／角色介面 ===== */
const G9={open:null,sel:null,tab:"all",msg:"",cf:null,skn:"c"};
const esc9=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const JOBI9={knight:"🛡️",mage:"🔮",priest:"✨",assassin:"🗡️",berserker:"🪓",archer:"🏹",summoner:"📜",samurai:"⚔️"};
const RARC9=["#8a6840","#4a7fb5","#8a57c4","#b8820a"],SL9={weapon:"武器",armor:"防具",acc:"飾品"},SI9={weapon:"🗡️",armor:"🥋",acc:"💍"};
function ic9(it){const n=it.n;return/劍|刀/.test(n)?"🗡️":/鎧|盔|盾/.test(n)?"🛡️":/甲|衣|袍/.test(n)?"🥋":/戒/.test(n)?"💍":/鍊|鏈/.test(n)?"📿":/符/.test(n)?"🧿":/章/.test(n)?"🏅":SI9[it.s]||"📦"}
function ui9close(){const o=document.getElementById("ui9");if(o)o.remove();G9.open=null}
function ui9mount(kind){let o=document.getElementById("ui9");if(!o||G9.open!==kind){ui9close();o=document.createElement("div");o.id="ui9";o.className="ui9";o.addEventListener("click",ui9click);document.body.appendChild(o)}G9.open=kind;ui9render()}
function ui9render(){const o=document.getElementById("ui9");if(!o)return;o.innerHTML=G9.open==="sk"?sk9():inv9()}
function act9(fn,snd){say("");fn();G9.msg=$("message").textContent.split("\n").filter(Boolean).slice(0,2).join(" ");if(snd)sfx8(snd);ui9render()}
function ui9click(e){const t=e.target;if(t&&t.id==="ui9"){ui9close();return}const b=t&&t.closest&&t.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=+b.dataset.id;
if(a==="close")return ui9close();
if(a==="tab"){G9.tab=b.dataset.tab;G9.cf=null;G9.msg="";return ui9render()}
if(a==="sel"){G9.sel=id;G9.cf=null;G9.msg="";return ui9render()}
if(a==="skn"){G9.skn=b.dataset.k;G9.msg="";return ui9render()}
if(a==="job"){ui9close();return jobMenu()}
if(a==="learn"){const nm=b.dataset.k;if((p.skillPoints||0)<1){G9.msg="技能點數不足！";return ui9render()}learnTreeSkill(nm);G9.msg="✨ 習得「"+nm+"」！";sfx8("chest");return ui9render()}
if(a==="promo")return act9(()=>promoteTo(b.dataset.k),"lvl");
if(a==="do"){const d=b.dataset.do;if(d==="sell"&&G9.cf!==id){G9.cf=id;return ui9render()}G9.cf=null;if(d==="equip")act9(()=>equipItem(id));else if(d==="enh")act9(()=>enhance(id));else if(d==="sell")act9(()=>sellItem(id));else if(d==="unequip")act9(()=>unequip(b.dataset.slot))}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&G9.open)ui9close()});
/* --- 背包／角色 --- */
function cell9(it){return`<button class="cell9 r${it.rar}${G9.sel===it.id?" on":""}" data-act="sel" data-id="${it.id}" title="${esc9(itemDesc(it))}"><span>${ic9(it)}</span>${it.lv?`<i>+${it.lv}</i>`:""}</button>`}
function inv9(){ensureEq();const eq=p.equip,items=p.inv.filter(x=>G9.tab==="all"||x.s===G9.tab),f=G9.sel!=null?findItem(G9.sel):null;if(!f)G9.sel=null;
const slot=s=>`<div class="slw9">${eq[s]?cell9(eq[s]):`<div class="cell9 empty">${SI9[s]}</div>`}<small>${SL9[s]}</small></div>`;
let det;if(f){const it=f.it,bag=f.at==="bag",cur=eq[it.s],cost=enhCost(it),maxed=it.lv>=MAX_ENH;let cmp="";if(bag&&cur){if(cur.st===it.st){const d=itemVal(it)-itemVal(cur);cmp=d>0?` <b style="color:#2e8b3e">▲${d}</b>`:d<0?` <b style="color:#c0392b">▼${-d}</b>`:" ＝"}else cmp="（屬性與目前裝備不同）"}
det=`<div class="nm9" style="color:${RARC9[it.rar]}">${esc9(itemName(it))} <small>［${RAR[it.rar]}］</small></div><div>${STAT_N[it.st]} +${itemVal(it)}${cmp}｜${bag?"背包":"已裝備"}</div><div class="sm9">強化：${maxed?"已達上限":cost+" G，成功率 "+Math.round(enhRate(it)*100)+"%"}${bag?"｜出售 "+sellPrice(it)+" G":""}</div><div class="btns9">${bag?`<button class="b9 g" data-act="do" data-do="equip" data-id="${it.id}">裝備</button>`:`<button class="b9" data-act="do" data-do="unequip" data-id="${it.id}" data-slot="${f.at}">卸下</button>`}<button class="b9" data-act="do" data-do="enh" data-id="${it.id}" ${maxed||p.gold<cost?"disabled":""}>強化</button>${bag?`<button class="b9 r" data-act="do" data-do="sell" data-id="${it.id}">${G9.cf===it.id?"⚠️ 再按確認出售":"出售"}</button>`:""}</div>`}
else det=`<div class="sm9">點選物品查看詳情。稀有以上裝備只能靠戰鬥掉落，商店販售普通品質裝備。</div>`;
const cells=items.map(cell9).join("")+Array.from({length:Math.max(0,BAG_MAX-items.length)},()=>'<div class="cell9 empty"></div>').join("");
const tabs=[["all","🎒"],["weapon","🗡️"],["armor","🥋"],["acc","💍"]].map(x=>`<button class="tab9${G9.tab===x[0]?" on":""}" data-act="tab" data-tab="${x[0]}" aria-label="${x[0]}">${x[1]}</button>`).join("");
return`<div class="wrap9"><section class="pn9"><div class="hd9">⭐ 角色<button class="x9 b9" data-act="close" aria-label="關閉">✕</button></div><div class="inner9"><div class="who9">${esc9(p.name)}｜${esc9(p.job)} Lv.${p.lv}</div><div class="doll9">${slot("armor")}<div class="hero9">🐷</div><div class="slw9 col">${slot("weapon")}${slot("acc")}</div></div><div class="st9"><span>⚔️ ${effectiveAtk()}</span><span>🛡️ ${effectiveDef()}</span><span>❤️ ${p.hp}/${p.maxHp}</span><span>💧 ${p.mp}/${p.maxMp}</span></div><div class="st9"><span>🪙 ${p.gold}</span><span>🧪 ${p.potions}</span></div></div></section><section class="pn9"><div class="hd9">🎒 物品欄 <span class="cnt9">${p.inv.length}/${BAG_MAX}</span></div><div class="inner9"><div class="invbody9"><div class="grid9">${cells}</div><div class="tabs9">${tabs}</div></div><div class="det9">${G9.msg?`<div class="msg9">${esc9(G9.msg)}</div>`:""}${det}</div></div></section></div>`}
/* --- 技能樹（六角蜂巢） --- */
function sk9(){ensureEq();const key=p.jobKey||"knight",J=JOBS[key],tree=SKILL_TREES[key],L=p.learnedSkills||{},SP=p.skillPoints||0,promos=PROMOTIONS[key]||[],S=34,
P=(q,r)=>[S*1.7320508*(q+r/2),S*1.5*r],HP=(cx,cy,rad)=>[0,1,2,3,4,5].map(k=>{const a=(60*k+30)*Math.PI/180;return(cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1)}).join(" "),
LA=[[-1,0],[-2,0],[-2,1],[-3,0],[-3,1],[-3,2],[-1,1],[-2,2]],RP=[[1,0],[2,0],[2,-1],[3,0],[1,-1],[2,-2]],RR=[[3,-1],[3,-2]];
const nodes=[{id:"c",ty:"core",nm:J.name,ic:JOBI9[key]||"🐷",q:0,r:0,on:true}];let ai=0,pi=0;
tree.forEach(s=>{const on=!!L[key+":"+s[0]];if(s[1]==="active"){const pos=LA[ai%LA.length];nodes.push({id:"a"+ai,ty:"act",s,nm:s[0],ic:s[3]>0?"⚔️":"🌀",q:pos[0],r:pos[1],t:++ai,on,can:!on&&SP>=1})}else{const pos=RP[pi%RP.length];nodes.push({id:"p"+pi,ty:"pas",s,nm:s[0],ic:"🔰",q:pos[0],r:pos[1],t:++pi,on,can:!on&&SP>=1})}});
promos.forEach((x,i)=>{const pos=RR[i%2],on=p.promotionKey===x[0];nodes.push({id:"r"+i,ty:"pro",pr:x,nm:x[0],ic:"👑",q:pos[0],r:pos[1],t:"Lv10",on,can:!p.promotionKey&&p.lv>=10&&SP>=3})});
const dist=(a,b)=>{const dq=a.q-b.q,dr=a.r-b.r;return(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2},occ={};nodes.forEach(n=>occ[n.q+","+n.r]=1);
let bd="";for(let q=-4;q<=4;q++)for(let r=-3;r<=3;r++){if(occ[q+","+r])continue;const c=P(q,r);if(Math.abs(c[0])>225||Math.abs(c[1])>125)continue;bd+=`<polygon class="bd9" points="${HP(c[0],c[1],S-2)}"/>`}
let lines="";nodes.forEach((n,i)=>{if(!i)return;const j=nodes.findIndex((m,k)=>k<i&&dist(n,m)===1);if(j<0)return;const m=nodes[j],a=P(n.q,n.r),b=P(m.q,m.r);lines+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="ln9${n.on&&m.on?" lit":""}"/>`});
const sel=nodes.find(n=>n.id===G9.skn)||nodes[0];
const hx=nodes.map(n=>{const c=P(n.q,n.r),x=c[0].toFixed(1),y=c[1];return`<g data-act="skn" data-k="${n.id}"><polygon class="hx9 ${n.ty} ${n.on?"on":"off"}${n.can?" can":""}${n===sel?" sel":""}" points="${HP(c[0],y,S-2)}"/><text class="ic9t" x="${x}" y="${(y+2).toFixed(1)}">${n.ic}</text><text class="nm9t" x="${x}" y="${(y+16).toFixed(1)}">${esc9(n.nm.slice(0,5))}</text>${n.t?`<text class="nu9t ${n.ty}" x="${(c[0]-18).toFixed(1)}" y="${(y-14).toFixed(1)}">${n.t}</text>`:""}${n.on&&n.ty!=="core"?`<text class="ck9t" x="${(c[0]+19).toFixed(1)}" y="${(y-14).toFixed(1)}">✓</text>`:""}</g>`}).join("");
const bt=h=>`<div class="btns9">${h}</div>`;let d;
if(sel.ty==="core")d=`<div class="nm9">${JOBI9[key]||""} ${esc9(J.name)}${p.promotionKey?" → "+esc9(p.promotionKey):""}</div><div>${esc9(J.desc||"")}</div><div class="sm9">專屬技能：${esc9(J.skill)}（${J.cost} MP）｜被動：${esc9(J.passive)}（${esc9(J.passiveDesc)}）</div>`+bt(`<button class="b9 g" data-act="job">🔁 切換職業</button>`);
else if(sel.ty==="pro"){const x=sel.pr;d=`<div class="nm9" style="color:#9a6b00">👑 ${esc9(x[0])}</div><div>${esc9(x[3])}</div><div class="sm9">永久加成：${esc9(x[1])} +${x[2]}｜需求 Lv.10、3 技能點</div>`+bt(sel.on?`<button class="b9" disabled>✓ 已轉職</button>`:`<button class="b9 g" data-act="promo" data-k="${esc9(x[0])}" ${sel.can?"":"disabled"}>進階轉職（3 點）</button>`)+(!sel.on&&!sel.can?`<div class="sm9">${p.promotionKey?"已完成進階轉職。":p.lv<10?"尚未達到 Lv.10。":"技能點不足。"}</div>`:"")}
else{const s=sel.s,b=TREE_B[s[0]],act=s[1]==="active";d=`<div class="nm9">${sel.ic} ${esc9(s[0])} <small>［${act?"主動":"被動"}］</small></div><div>${act?`消耗 ${s[2]} MP｜${s[3]>0?"效果倍率 ×"+s[3]:"輔助／特殊效果"}`:(b?`${STAT_N[b[0]]} +${b[1]}`:"戰鬥中自動生效的被動強化")}</div>`+bt(sel.on?`<button class="b9" disabled>✓ 已學習</button>`:`<button class="b9 g" data-act="learn" data-k="${esc9(s[0])}" ${SP>=1?"":"disabled"}>學習（1 點）</button>`)+(!sel.on&&SP<1?`<div class="sm9">技能點不足，升級可獲得技能點。</div>`:"")}
return`<div class="wrap9" style="grid-template-columns:1fr"><section class="pn9"><div class="hd9">🌟 技能樹｜${esc9(p.job)}<span class="sp9"></span><span class="chip9">Lv.${p.lv}</span><span class="chip9">⭐ 技能點 ${SP}</span><button class="x9 b9" data-act="close" aria-label="關閉">✕</button></div><svg viewBox="-250 -150 500 300" role="img" aria-label="技能樹">${bd}${lines}${hx}</svg><div class="lg9"><span>🟧 主動</span><span>🟪 被動</span><span>🟨 進階轉職</span><span>⚪ 閃爍＝可學習</span></div><div class="inner9 det9">${G9.msg?`<div class="msg9">${esc9(G9.msg)}</div>`:""}${d}</div></section></div>`}
/* --- 掛接原有選單 --- */
equipMenu=function(){if(inBattle)return;ensureEq();G9.msg="";ui9mount("inv")};
bagMenu=function(){equipMenu()};
slotMenu=function(s){if(inBattle)return;ensureEq();G9.sel=p.equip[s]?p.equip[s].id:null;ui9mount("inv")};
itemMenu=function(id){if(inBattle)return;G9.sel=id;ui9mount("inv")};
skillMenu=function(){if(inBattle)return;ensureEq();G9.msg="";G9.skn="c";ui9mount("sk")};
</script></body></html>
