<html lang="zh-Hant">
<head>

<title>豬豬勇者傳說｜第三階段裝備系統版</title>
<style>

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:10px;padding:11px 9px;background:#e9b75f;color:#49372e;font-weight:750;cursor:pointer;box-shadow:0 3px 0 #bd8b3c;transition:.1s}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#d9e8cf;box-shadow:0 3px 0 #9ab58d}button.danger{background:#efb2b2;box-shadow:0 3px 0 #c77f7f}

footer{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}footer button{font-size:13px}
.bar{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#e87979}
.overlay{position:absolute;inset:0;background:#392b36d9;display:grid;place-items:center;padding:20px;z-index:5}
.modal{background:#fff6e9;border:4px solid #e5bb77;border-radius:18px;padding:24px;text-align:center;max-width:390px;width:100%}.modal .pig{font-size:76px}
@media(max-width:700px){main{grid-template-columns:1fr}#scene{min-height:270px}.panel{min-height:280px}}
</style></head>
<body><div id="game">
<header><h1>🐷 豬豬勇者傳說</h1><span class="tag">第三階段・裝備系統</span></header>
<div id="hud"></div>
<main>
<section id="scene"><div class="caption" id="location">波波新手村</div><div class="hill"></div><div class="tree a">🌳</div><div class="tree b">🌲</div><div class="village">🏡</div><div class="hero" id="hero">🐷</div></section>
<section class="panel"><div id="message">歡迎來到波波新手村！村長似乎有事情想拜託你。先和村長聊聊，開始你的冒險吧！</div>
<div id="actions" class="actions"></div><div id="log"></div></section>
</main>
<footer><button class="secondary" onclick="talk()">💬 和村長交談</button><button class="secondary" onclick="explore()">🌿 前往村外探索</button><button class="secondary" onclick="showStatus()">📜 角色狀態</button><button class="secondary" onclick="jobMenu()">🛡️ 職業選擇</button><button class="secondary" onclick="skillMenu()">✨ 技能樹</button><button class="secondary" onclick="equipMenu()">⚔️ 裝備背包</button><button class="secondary" onclick="shopMenu()">🏪 商店</button><button class="secondary" onclick="saveGame()">💾 儲存進度</button><button class="secondary" onclick="loadGame()">📂 載入進度</button><button class="danger" onclick="resetGame()">重新開始</button></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const JOBS={"knight": {"name": "騎士", "hp": 55, "mp": 10, "atk": 8, "def": 7, "skill": "盾擊", "cost": 3, "kind": "damage", "power": 1.5, "desc": "高生命與防禦，擅長保護隊友。", "passive": "鋼鐵意志", "passiveDesc": "防禦 +2"}, "mage": {"name": "魔法師", "hp": 34, "mp": 28, "atk": 5, "def": 2, "skill": "火焰彈", "cost": 5, "kind": "damage", "power": 2.5, "desc": "低防禦、高 MP，魔法爆發強。", "passive": "魔力共鳴", "passiveDesc": "最大 MP +8"}, "priest": {"name": "祭司", "hp": 42, "mp": 24, "atk": 5, "def": 4, "skill": "治癒術", "cost": 5, "kind": "heal", "power": 0.35, "desc": "擅長恢復生命與支援。", "passive": "慈愛之心", "passiveDesc": "治療效果 +30%"}, "assassin": {"name": "刺客", "hp": 38, "mp": 14, "atk": 12, "def": 2, "skill": "影襲", "cost": 4, "kind": "damage", "power": 2.0, "desc": "高攻擊與爆擊，防禦較低。", "passive": "致命節奏", "passiveDesc": "攻擊 +2"}, "berserker": {"name": "狂戰士", "hp": 48, "mp": 10, "atk": 14, "def": 2, "skill": "狂暴斬", "cost": 4, "kind": "damage", "power": 2.3, "desc": "極高攻擊，適合快速擊倒敵人。", "passive": "狂戰本能", "passiveDesc": "攻擊 +3"}, "archer": {"name": "弓箭手", "hp": 40, "mp": 16, "atk": 10, "def": 3, "skill": "穿心箭", "cost": 4, "kind": "damage", "power": 1.9, "desc": "攻守均衡，穩定輸出。", "passive": "鷹眼", "passiveDesc": "攻擊 +2"}, "summoner": {"name": "召喚師", "hp": 39, "mp": 26, "atk": 6, "def": 3, "skill": "史萊姆召喚", "cost": 6, "kind": "damage", "power": 2.2, "desc": "消耗較多 MP，召喚夥伴攻擊。", "passive": "契約連結", "passiveDesc": "最大 MP +6"}, "samurai": {"name": "武士", "hp": 44, "mp": 16, "atk": 11, "def": 4, "skill": "居合斬", "cost": 5, "kind": "damage", "power": 2.1, "desc": "攻擊與防禦兼備，擅長強力斬擊。", "passive": "劍心", "passiveDesc": "攻擊 +1、防禦 +1"}};
const SKILL_TREES = {"knight": [["盾擊", "active", 3, 1.5], ["鋼鐵意志", "passive", 0, 0], ["守護姿態", "active", 4, 0], ["挑釁", "active", 4, 0], ["盾牆", "passive", 0, 0], ["正義打擊", "active", 6, 2.0], ["堅毅", "passive", 0, 0], ["聖光反擊", "active", 7, 2.3], ["不屈之心", "passive", 0, 0], ["王者守護", "active", 10, 3.0]], "mage": [["火焰彈", "active", 5, 2.0], ["魔力共鳴", "passive", 0, 0], ["冰霜箭", "active", 5, 1.8], ["魔力護盾", "active", 6, 0], ["元素精通", "passive", 0, 0], ["雷電術", "active", 7, 2.5], ["魔力節流", "passive", 0, 0], ["隕石術", "active", 9, 3.0], ["奧術專注", "passive", 0, 0], ["大爆裂魔法", "active", 12, 4.0]], "priest": [["治癒術", "active", 5, 0.35], ["慈愛之心", "passive", 0, 0], ["神聖之光", "active", 6, 0.5], ["祝福", "active", 5, 0], ["祈禱", "passive", 0, 0], ["淨化術", "active", 6, 0.25], ["聖域", "passive", 0, 0], ["復甦之雨", "active", 9, 0.7], ["神恩", "passive", 0, 0], ["天使降臨", "active", 12, 1.0]], "assassin": [["影襲", "active", 4, 2.0], ["致命節奏", "passive", 0, 0], ["淬毒刃", "active", 5, 1.8], ["煙幕", "active", 4, 0], ["背刺精通", "passive", 0, 0], ["連環斬", "active", 7, 2.4], ["迅捷步伐", "passive", 0, 0], ["暗影突刺", "active", 8, 2.8], ["弱點洞察", "passive", 0, 0], ["幻影絕殺", "active", 12, 4.0]], "berserker": [["狂暴斬", "active", 4, 2.3], ["狂戰本能", "passive", 0, 0], ["怒意爆發", "active", 5, 2.0], ["嗜血", "active", 5, 0], ["狂怒體質", "passive", 0, 0], ["裂地重擊", "active", 7, 2.6], ["痛覺抑制", "passive", 0, 0], ["戰吼", "active", 7, 0], ["血之渴望", "passive", 0, 0], ["毀滅旋風", "active", 12, 4.0]], "archer": [["穿心箭", "active", 4, 1.9], ["鷹眼", "passive", 0, 0], ["二連射", "active", 5, 2.0], ["纏足箭", "active", 4, 1.6], ["穩定射擊", "passive", 0, 0], ["爆裂箭", "active", 7, 2.5], ["獵人直覺", "passive", 0, 0], ["箭雨", "active", 8, 2.8], ["致命瞄準", "passive", 0, 0], ["流星箭陣", "active", 12, 4.0]], "summoner": [["史萊姆召喚", "active", 6, 2.2], ["契約連結", "passive", 0, 0], ["火靈契約", "active", 6, 2.0], ["守護精靈", "active", 5, 0], ["召喚增幅", "passive", 0, 0], ["冰狼召喚", "active", 8, 2.6], ["靈力回流", "passive", 0, 0], ["雷鳥召喚", "active", 9, 3.0], ["共鳴契約", "passive", 0, 0], ["遠古巨獸", "active", 13, 4.2]], "samurai": [["居合斬", "active", 5, 2.1], ["劍心", "passive", 0, 0], ["燕返", "active", 5, 2.0], ["架勢", "active", 4, 0], ["心眼", "passive", 0, 0], ["疾風斬", "active", 7, 2.5], ["武士道", "passive", 0, 0], ["月影斬", "active", 8, 2.9], ["無念無想", "passive", 0, 0], ["天翔一閃", "active", 12, 4.0]]};
const PROMOTIONS = {"knight": [["聖騎士", "HP", 18, "守護與聖光兼備的前線壁壘"], ["皇家衛士", "DEF", 4, "以極高防禦守護隊伍"]], "mage": [["大魔導師", "MP", 18, "掌握高階元素魔法"], ["元素賢者", "MATK", 5, "精通多種元素的術者"]], "priest": [["主教", "MP", 12, "強化治療與祝福能力"], ["神諭者", "HP", 12, "以神聖力量支援全隊"]], "assassin": [["暗影宗師", "ATK", 5, "擅長爆發與致命突襲"], ["幻刃", "SPD", 5, "以高速連擊制敵"]], "berserker": [["狂戰領主", "ATK", 6, "將怒氣化為破壞力"], ["戰爭巨獸", "HP", 22, "以生命與蠻力碾壓敵人"]], "archer": [["神射手", "ATK", 5, "精準射擊的遠程專家"], ["遊俠", "SPD", 5, "擅長機動與野外作戰"]], "summoner": [["契約大師", "MP", 18, "與強大靈體締結契約"], ["靈獸使", "HP", 15, "強化召喚物與生存能力"]], "samurai": [["劍聖", "ATK", 6, "將劍技磨練至極致"], ["武神", "DEF", 3, "攻守兼備的武道宗師"]]};
function jobStats(key,lv){const j=JOBS[key]||JOBS.knight;const passiveBonus=(p&&p.learnedPassives&&p.learnedPassives[key])?(key==="mage"?8:key==="summoner"?6:0):0;return {maxHp:j.hp+(lv-1)*8,maxMp:j.mp+(lv-1)*3+passiveBonus,atk:j.atk+(lv-1)*2,def:j.def+(lv-1)}}
function applyJob(key,initial=false){const j=JOBS[key];if(!j)return;const oldHp=p.maxHp||40,oldMp=p.maxMp||12;const hpRatio=initial?1:(p.hp/oldHp),mpRatio=initial?1:(p.mp/oldMp);p.jobKey=key;const st=jobStats(key,p.lv||1);Object.assign(p,st);p.maxHp+=eqB("hp");p.maxMp+=bonusMp();p.eqHp=eqB("hp");p.eqMp=bonusMp();const promo=(PROMOTIONS[key]||[]).find(x=>x[0]===p.promotionKey);if(promo){p.job=promo[0];if(promo[1]==="HP"){p.maxHp+=promo[2];p.hp=Math.min(p.maxHp,Math.round(p.maxHp*hpRatio))}else if(promo[1]==="MP"){p.maxMp+=promo[2];p.mp=Math.min(p.maxMp,Math.round(p.maxMp*mpRatio))}else if(promo[1]==="ATK")p.atk+=promo[2];else if(promo[1]==="DEF")p.def+=promo[2];else if(promo[1]==="SPD")p.atk+=Math.floor(promo[2]/2)}else{p.promotionKey=null;p.job=j.name}p.hp=Math.max(1,Math.min(p.maxHp,Math.round(p.maxHp*hpRatio)));p.mp=Math.max(0,Math.min(p.maxMp,Math.round(p.maxMp*mpRatio)));if(!p.learnedPassives)p.learnedPassives={};if(!Number.isFinite(p.skillPoints))p.skillPoints=0;if(!p.learnedSkills)p.learnedSkills={};}
function passiveLearned(){return !!(p.learnedPassives&&p.learnedPassives[p.jobKey])}
function effectiveAtk(){return p.atk+eqB("atk")+treeB("atk")+((passiveLearned()&&["assassin","berserker","archer","samurai"].includes(p.jobKey))?(p.jobKey==="berserker"?3:p.jobKey==="samurai"?1:2):0)}
function effectiveDef(){return p.def+eqB("def")+treeB("def")+((passiveLearned()&&p.jobKey==="knight")?2:((passiveLearned()&&p.jobKey==="samurai")?1:0))}
let p={name:"波波",job:"見習勇者",lv:1,xp:0,next:20,hp:40,maxHp:40,mp:12,maxMp:12,atk:8,def:3,gold:0,potions:2,jobKey:"knight",skillPoints:0,learnedPassives:{},learnedSkills:{},inv:[],equip:{weapon:null,armor:null,acc:null},iid:0};
applyJob("knight",true);
let enemy=null,turn="player",inBattle=false,quest=false,won=false,log=[];
/* ===== 裝備系統 ===== */
const SLOTS={weapon:"🗡️ 武器",armor:"🛡️ 防具",acc:"💍 飾品"},STAT_N={atk:"攻擊",def:"防禦",hp:"HP",mp:"MP"},RAR=["普通","稀有","史詩","傳說"],RAR_I=["⚪","🔵","🟣","🟡"],RAR_M=[1,1.4,1.9,2.6],MAX_ENH=10,BAG_MAX=20;
const EQ_BASE=[{s:"weapon",n:"木劍",st:"atk",v:2,step:1,price:30},{s:"weapon",n:"鐵劍",st:"atk",v:4,step:1,price:90},{s:"weapon",n:"精鋼劍",st:"atk",v:7,step:2,price:220},{s:"armor",n:"布甲",st:"def",v:1,step:1,price:25},{s:"armor",n:"皮甲",st:"def",v:2,step:1,price:70},{s:"armor",n:"鎖甲",st:"def",v:4,step:1,price:180},{s:"acc",n:"幸運戒指",st:"hp",v:8,step:3,price:60},{s:"acc",n:"魔力項鍊",st:"mp",v:5,step:2,price:60},{s:"acc",n:"力量護符",st:"atk",v:2,step:1,price:100}];
function ensureEq(){p.inv=Array.isArray(p.inv)?p.inv:[];p.equip=p.equip||{};Object.keys(SLOTS).forEach(s=>{if(!p.equip[s])p.equip[s]=null});p.iid=p.iid||0}
function itemVal(it){return Math.round(it.v*RAR_M[it.rar])+it.lv*it.step}
function itemName(it){return `${RAR_I[it.rar]}${it.n}${it.lv?"+"+it.lv:""}`}
function itemDesc(it){return `${itemName(it)}［${RAR[it.rar]}］${STAT_N[it.st]} +${itemVal(it)}`}
function eqB(st){let t=0;if(p&&p.equip)for(const s in p.equip){const it=p.equip[s];if(it&&it.st===st)t+=itemVal(it)}return t}
const TREE_B={"鋼鐵意志":["def",1],"魔力共鳴":["mp",3],"契約連結":["mp",3],"致命節奏":["atk",1],"狂戰本能":["atk",1],"鷹眼":["atk",1]};
function treeB(st){let t=0;if(p&&p.learnedSkills)for(const k in p.learnedSkills){if(!p.learnedSkills[k]||!k.startsWith(p.jobKey+":"))continue;const b=TREE_B[k.split(":")[1]];if(b&&b[0]===st)t+=b[1]}return t}
function bonusMp(){return eqB("mp")+treeB("mp")}
function newItem(b,rar){ensureEq();return{id:++p.iid,s:b.s,n:b.n,st:b.st,v:b.v,step:b.step,price:b.price,rar,lv:0}}
function enhCost(it){return Math.round(15*(it.lv+1)*(1+it.rar*.5))}
function enhRate(it){return it.lv<3?1:Math.max(.3,1-(it.lv-2)*.1)}
function sellPrice(it){return Math.floor(it.price*RAR_M[it.rar]*.5)+it.lv*10}
function refreshEquip(){const h=eqB("hp"),m=bonusMp(),dh=h-(p.eqHp||0),dm=m-(p.eqMp||0);p.maxHp+=dh;p.maxMp+=dm;p.hp=Math.max(1,Math.min(p.maxHp,p.hp+Math.max(dh,0)));p.mp=Math.max(0,Math.min(p.maxMp,p.mp+Math.max(dm,0)));p.eqHp=h;p.eqMp=m;hud()}
function findItem(id){ensureEq();const it=p.inv.find(x=>x.id===id);if(it)return{it,at:"bag"};for(const s in p.equip)if(p.equip[s]&&p.equip[s].id===id)return{it:p.equip[s],at:s};return null}
function equipMenu(){if(inBattle)return;ensureEq();say(`【裝備】\n${Object.entries(SLOTS).map(([s,n])=>`${n}：${p.equip[s]?itemDesc(p.equip[s]):"（空）"}`).join("\n")}\n攻擊 ${effectiveAtk()}　防禦 ${effectiveDef()}　HP ${p.hp}/${p.maxHp}　MP ${p.mp}/${p.maxMp}\n🎒 背包 ${p.inv.length}/${BAG_MAX}　🪙 ${p.gold} G`);buttons(Object.entries(SLOTS).map(([s,n])=>[`${n}：${p.equip[s]?itemName(p.equip[s]):"（空）"}`,()=>slotMenu(s)]).concat([["🎒 背包",bagMenu],["🏪 商店",shopMenu],["返回角色狀態",showStatus]]))}
function slotMenu(s){if(inBattle)return;ensureEq();const cur=p.equip[s],bag=p.inv.filter(x=>x.s===s);say(`${SLOTS[s]}\n目前：${cur?itemDesc(cur):"（空）"}\n背包中可更換：${bag.length} 件`);const o=bag.map(x=>[`裝備 ${itemDesc(x)}`,()=>equipItem(x.id)]);if(cur)o.push(["管理目前裝備（強化／卸下）",()=>itemMenu(cur.id)]);o.push(["返回",equipMenu]);buttons(o)}
function bagMenu(){if(inBattle)return;ensureEq();say(p.inv.length?`【背包 ${p.inv.length}/${BAG_MAX}】點選裝備可穿戴、強化或出售。`:"背包是空的。打倒怪物有機會掉落裝備！");buttons(p.inv.map(x=>[itemDesc(x),()=>itemMenu(x.id)]).concat([["返回",equipMenu]]))}
function itemMenu(id){if(inBattle)return;const f=findItem(id);if(!f){equipMenu();return}const it=f.it;say(`${itemDesc(it)}\n位置：${f.at==="bag"?"背包":"已裝備"}\n強化：${it.lv>=MAX_ENH?"已達上限 +"+MAX_ENH:enhCost(it)+" G，成功率 "+Math.round(enhRate(it)*100)+"%"}\n出售價：${sellPrice(it)} G`);const o=[f.at==="bag"?["裝備",()=>equipItem(id)]:["卸下",()=>unequip(it.s)],["強化",()=>enhance(id)]];if(f.at==="bag")o.push(["出售",()=>sellItem(id),"danger"]);o.push(["返回",f.at==="bag"?bagMenu:equipMenu]);buttons(o)}
function equipItem(id){if(inBattle)return;const f=findItem(id);if(!f||f.at!=="bag")return;const it=f.it,old=p.equip[it.s];p.inv=p.inv.filter(x=>x.id!==id);if(old)p.inv.push(old);p.equip[it.s]=it;refreshEquip();say(`已裝備 ${itemDesc(it)}。${old?"換下的 "+itemName(old)+" 已放入背包。":""}\n攻擊 ${effectiveAtk()}　防禦 ${effectiveDef()}`);addLog("裝備 "+itemName(it));buttons([["返回裝備",equipMenu]])}
function unequip(s){if(inBattle)return;const it=p.equip[s];if(!it)return;if(p.inv.length>=BAG_MAX){say("背包已滿，無法卸下！");buttons([["返回",equipMenu]]);return}p.equip[s]=null;p.inv.push(it);refreshEquip();say(`已卸下 ${itemName(it)}。`);addLog("卸下 "+itemName(it));buttons([["返回裝備",equipMenu]])}
function enhance(id){if(inBattle)return;const f=findItem(id);if(!f)return;const it=f.it;if(it.lv>=MAX_ENH){say("這件裝備已強化到上限！");buttons([["返回",()=>itemMenu(id)]]);return}const c=enhCost(it);if(p.gold<c){say(`金幣不足！強化需要 ${c} G，你只有 ${p.gold} G。`);buttons([["返回",()=>itemMenu(id)]]);return}p.gold-=c;if(Math.random()<enhRate(it)){it.lv++;say(`✨ 強化成功！${itemDesc(it)}（花費 ${c} G）`);addLog("強化成功："+itemName(it))}else{say(`強化失敗……裝備沒有損壞，但 ${c} G 已用掉。`);addLog("強化失敗："+itemName(it))}refreshEquip();buttons([["再強化一次",()=>enhance(id)],["返回",()=>itemMenu(id)]])}
function sellItem(id){if(inBattle)return;const f=findItem(id);if(!f||f.at!=="bag")return;const g=sellPrice(f.it);p.inv=p.inv.filter(x=>x.id!==id);p.gold+=g;hud();say(`賣出 ${itemName(f.it)}，獲得 ${g} G。`);addLog(`賣出 ${itemName(f.it)} +${g} G`);buttons([["返回背包",bagMenu]])}
function shopMenu(){if(inBattle)return;ensureEq();say(`【裝備商店】🪙 ${p.gold} G　🎒 ${p.inv.length}/${BAG_MAX}\n商店販售普通品質裝備，稀有以上只能靠戰鬥掉落。`);buttons([[`🧪 藥水 15G`,buyPotion]].concat(EQ_BASE.map((b,i)=>[`${SLOTS[b.s].slice(0,2)}${b.n} ${STAT_N[b.st]}+${b.v}｜${b.price}G`,()=>buyEquip(i)]),[["返回",village]]))}
function buyPotion(){if(p.gold<15){say("金幣不足！");buttons([["返回商店",shopMenu]]);return}p.gold-=15;p.potions++;hud();say("購買了 1 瓶藥水。");addLog("購買藥水");buttons([["繼續購物",shopMenu]])}
function buyEquip(i){const b=EQ_BASE[i];ensureEq();if(p.gold<b.price){say(`金幣不足！${b.n} 需要 ${b.price} G，你只有 ${p.gold} G。`);buttons([["返回商店",shopMenu]]);return}if(p.inv.length>=BAG_MAX){say("背包已滿，請先出售或穿戴裝備。");buttons([["返回商店",shopMenu]]);return}p.gold-=b.price;const it=newItem(b,0);p.inv.push(it);hud();say(`購買了 ${itemDesc(it)}！`);addLog("購買 "+b.n);buttons([["立即裝備",()=>equipItem(it.id)],["繼續購物",shopMenu]])}
function rollDrop(){if(Math.random()>=.4)return"";ensureEq();const r=Math.random(),rar=r<.6?0:r<.88?1:r<.98?2:3,it=newItem(EQ_BASE[Math.floor(Math.random()*EQ_BASE.length)],rar);if(p.inv.length>=BAG_MAX){const g=sellPrice(it);p.gold+=g;addLog("背包已滿，自動賣出 "+itemName(it));return` 🎁 掉落 ${itemName(it)}，但背包已滿，自動賣出 ${g} G。`}p.inv.push(it);addLog("獲得裝備："+itemName(it));return` 🎁 獲得裝備：${itemDesc(it)}！`}
function say(t){$("message").textContent=t}
function addLog(t){log.unshift(t);$("log").innerHTML=log.slice(0,5).map(x=>"・"+x).join("<br>")}
function hud(){$("hud").innerHTML=`<span class="stat">🐷 ${p.name}｜${p.job} Lv.${p.lv}</span><span class="stat">❤️ HP ${p.hp}/${p.maxHp}<div class="bar"><i style="width:${p.hp/p.maxHp*100}%"></i></div></span><span class="stat">💧 MP ${p.mp}/${p.maxMp}</span><span class="stat">⭐ EXP ${p.xp}/${p.next}</span><span class="stat">🪙 ${p.gold} G</span><span class="stat">🧪 藥水 ${p.potions}</span>`}
function buttons(items){$("actions").innerHTML="";items.forEach(([label,fn,cls])=>{let b=document.createElement("button");b.textContent=label;b.className=cls||"";b.onclick=fn;$("actions").appendChild(b)})}
function talk(){if(inBattle)return;if(!quest){quest=true;say("村長：勇敢的小豬啊！村外的史萊姆最近搗蛋不休。請打敗 3 隻史萊姆，保護村莊！完成後我會給你 30 金幣。");addLog("接下任務：擊敗 3 隻史萊姆。")}else if(!won){say("村長：拜託你了！村外有史萊姆出沒，累積打敗 3 隻就能完成任務。")}else{say("村長：你是村莊的英雄！收下這份獎勵吧。");p.gold+=30;won=false;quest=false;addLog("任務獎勵：30 金幣");hud()}buttons([["繼續冒險",explore],["查看狀態",showStatus]])}
function explore(){if(inBattle)return; if(p.hp<=0){say("你需要先恢復體力。");buttons([["使用藥水",usePotion],["回村休息（免費）",rest]]);return}if(Math.random()<.78)startBattle();else{p.gold+=3; say("你在草叢裡找到 3 枚金幣！");addLog("探索找到 3 G");hud();buttons([["繼續探索",explore],["回村",village]])}}
function village(){inBattle=false;$("scene").classList.remove("battle");$("enemy")?.remove();$("location").textContent="波波新手村";say("你回到了安全的新手村。村莊的微風讓人安心。");buttons([["和村長交談",talk],["前往村外",explore],["休息恢復 HP / MP",rest],["商店",shopMenu]])}
function startBattle(){inBattle=true;enemy={name:"綠色史萊姆",emoji:"🟢",hp:18,maxHp:18,atk:5,xp:9,gold:5};$("scene").classList.add("battle");$("location").textContent="村外草原・遭遇戰";$("hero").textContent="🐷⚔️";let e=document.createElement("div");e.id="enemy";e.className="enemy";e.textContent="🟢";$("scene").appendChild(e);say("野生的綠色史萊姆出現了！選擇你的行動。");addLog("遭遇綠色史萊姆！");battleButtons();hud()}
function battleButtons(){const j=JOBS[p.jobKey]||JOBS.knight;let opts=[["⚔️ 普通攻擊",attack],[`✨ ${j.skill}（${j.cost} MP）`,skill]];const learned=Object.keys(p.learnedSkills||{}).filter(k=>p.learnedSkills[k]&&k.startsWith(p.jobKey+":"));learned.filter(k=>{const s=SKILL_TREES[p.jobKey].find(x=>x[0]===k.split(":")[1]);return s&&s[1]==="active"&&s[0]!==j.skill}).slice(0,3).forEach(k=>{const s=SKILL_TREES[p.jobKey].find(x=>x[0]===k.split(":")[1]);opts.push([`✨ ${s[0]}（${s[2]} MP）`,()=>useTreeSkill(s[0])])});opts.push(["🛡️ 防禦",defend],["🧪 使用藥水",usePotion],["🏃 逃跑",runAway]);buttons(opts)}
function attack(){if(!inBattle||turn!=="player")return;let d=Math.max(1,effectiveAtk()+Math.floor(Math.random()*4)-1);enemy.hp-=d;say(`波波使出普通攻擊，對史萊姆造成 ${d} 點傷害！`);addLog(`普通攻擊：${d} 傷害`);afterPlayer()}
function skill(){if(!inBattle||turn!=="player")return;const j=JOBS[p.jobKey]||JOBS.knight;if(p.mp<j.cost){say("MP 不足！");return}p.mp-=j.cost;if(j.kind==="heal"){let amount=Math.round(p.maxHp*j.power*(passiveLearned()?1.3:1));let healed=Math.min(amount,p.maxHp-p.hp);p.hp+=healed;say(`波波施展 ${j.skill}，恢復 ${healed} HP！`);addLog(`${j.skill}：恢復 ${healed} HP`)}else{let d=Math.round(effectiveAtk()*j.power+Math.random()*5);enemy.hp-=d;say(`波波使出 ${j.skill}！造成 ${d} 點傷害！`);addLog(`${j.skill}：${d} 傷害`)}hud();if(j.kind!=="heal"&&enemy.hp<=0){victory();return}enemyTurn(false)}
function defend(){if(!inBattle)return;say("波波架起防禦姿勢，準備承受攻擊！");enemyTurn(true)}
function afterPlayer(){hud();if(enemy.hp<=0){victory();return}enemyTurn(false)}
function enemyTurn(block){turn="enemy";setTimeout(()=>{if(!inBattle)return;let d=Math.max(1,enemy.atk-effectiveDef()-(block?5:0));p.hp=Math.max(0,p.hp-d);say(`史萊姆黏液撞向波波，造成 ${d} 點傷害！`);addLog(`受到 ${d} 點傷害`);hud();if(p.hp<=0){inBattle=false;say("波波暈倒了！村民把你帶回村莊，並恢復一半體力。");p.hp=Math.ceil(p.maxHp/2);p.mp=Math.ceil(p.maxMp/2);$("scene").classList.remove("battle");$("enemy")?.remove();$("hero").textContent="🐷";hud();buttons([["回到村莊",village]])}else{turn="player";battleButtons()}},650)}
function victory(){inBattle=false;p.xp+=enemy.xp;p.gold+=enemy.gold;let name=enemy.name;enemy=null;$("scene").classList.remove("battle");$("enemy")?.remove();$("hero").textContent="🐷";let text=`勝利！擊敗${name}，獲得 9 EXP、5 金幣。`;if(quest){p.kills=(p.kills||0)+1;text+=` 任務進度 ${p.kills}/3。`;if(p.kills>=3){won=true;text+=" 任務完成！回村找村長領取獎勵。"}}text+=rollDrop();say(text);addLog("戰鬥勝利，獲得經驗與金幣");if(p.xp>=p.next)levelUp();hud();buttons([["繼續探索",explore],["回村休息",village]])}
function levelUp(){p.xp-=p.next;p.lv++;p.next=Math.floor(p.next*1.45+8);p.skillPoints=(p.skillPoints||0)+1;applyJob(p.jobKey||"knight",true);p.hp=p.maxHp;p.mp=p.maxMp;say("✨ 升級了！波波現在 Lv."+p.lv+"！能力值提升，獲得 1 點技能點數。");addLog("升級！技能點數 +1；目前 Lv."+p.lv)}
function usePotion(){if(p.potions<=0){say("沒有藥水了！");return}if(p.hp===p.maxHp){say("HP 已經是滿的！");return}p.potions--;let heal=Math.min(20,p.maxHp-p.hp);p.hp+=heal;say(`使用小型藥水，恢復 ${heal} HP。`);hud();if(inBattle)enemyTurn(false);else buttons([["繼續",explore],["回村",village]])}
function runAway(){if(Math.random()<.75){inBattle=false;$("scene").classList.remove("battle");$("enemy")?.remove();$("hero").textContent="🐷";say("成功逃離戰鬥！");buttons([["繼續探索",explore],["回村",village]])}else{say("逃跑失敗！");enemyTurn(false)}}
function rest(){p.hp=p.maxHp;p.mp=p.maxMp;say("在村莊休息後，HP 和 MP 完全恢復！");hud();buttons([["前往村外",explore],["和村長交談",talk]])}

function showStatus(){say(`🐷 ${p.name}｜${p.job} Lv.${p.lv}
HP ${p.hp}/${p.maxHp}　MP ${p.mp}/${p.maxMp}
攻擊 ${effectiveAtk()}（裝備+${eqB("atk")}）　防禦 ${effectiveDef()}（裝備+${eqB("def")}）
EXP ${p.xp}/${p.next}　金幣 ${p.gold}
進階職業：${p.promotionKey||"尚未轉職"}\n技能點數：${p.skillPoints||0}｜被動：${passiveLearned()?JOBS[p.jobKey].passive:"尚未習得"}
目前任務：${quest?"擊敗 3 隻史萊姆（"+(p.kills||0)+"/3）":"尚未接取"}`);buttons([["裝備與背包",equipMenu],["職業選擇",jobMenu],["進階轉職",promotionMenu],["技能樹",skillMenu],["繼續探索",explore],["回村",village]])}
function jobMenu(){if(inBattle)return;say("選擇你的職業。轉職會改變能力值與專屬戰鬥技能，保留目前等級與經驗。");buttons(Object.entries(JOBS).map(([key,j])=>[`${j.name}｜HP ${j.hp} MP ${j.mp} ATK ${j.atk} DEF ${j.def}`,()=>chooseJob(key)]).concat([["返回角色狀態",showStatus]]))}
function chooseJob(key){const j=JOBS[key];if(!j)return;p.promotionKey=null;applyJob(key);say(`轉職成功！波波現在是「${j.name}」。${j.desc}專屬技能：${j.skill}（${j.cost} MP）。`);addLog("轉職為 "+j.name);hud();buttons([["查看技能樹",skillMenu],["查看狀態",showStatus],["回村",village]])}
function promotionMenu(){if(inBattle)return;const key=p.jobKey||"knight",list=PROMOTIONS[key]||[];const options=list.map(x=>[`${x[0]}｜${x[3]}（Lv.10、3 技能點）`,()=>promoteTo(x[0])]);say(`【進階轉職】目前職業：${JOBS[key].name}${p.promotionKey?" → "+p.promotionKey:""}\n需求：角色 Lv.10、至少 3 技能點。轉職會永久強化能力，並保留原職業技能樹。`);if(p.promotionKey)options.unshift(["已完成進階轉職",()=>promotionMenu()]);options.push(["返回角色狀態",showStatus]);buttons(options)}
function promoteTo(name){const key=p.jobKey||"knight",choice=(PROMOTIONS[key]||[]).find(x=>x[0]===name);if(!choice)return;if(p.lv<10){say("角色尚未達到 Lv.10，暫時不能進階轉職。");buttons([["返回",promotionMenu]]);return}if((p.skillPoints||0)<3){say("技能點數不足，需要 3 點技能點。");buttons([["返回",promotionMenu]]);return}if(p.promotionKey){say("已經完成進階轉職。若要選擇其他發展路線，請先回到基礎職業。");buttons([["返回",promotionMenu]]);return}p.skillPoints-=3;p.promotionKey=name;applyJob(key);say(`進階轉職成功！波波成為「${name}」！\n${choice[3]}\n能力值已強化，原職業技能樹仍可使用。`);addLog("進階轉職："+name);hud();buttons([["查看角色狀態",showStatus],["查看技能樹",skillMenu],["回村",village]])}
function skillMenu(){const key=p.jobKey||"knight",j=JOBS[key],tree=SKILL_TREES[key],learned=p.learnedSkills||{};let lines=tree.map((s,i)=>`${i+1}. ${s[0]}【${s[1]==="active"?"主動":"被動"}】${learned[key+":"+s[0]]?"✓ 已學習":"— 需技能點 1"}`).join("\n");say(`【${j.name}技能樹】\n技能點數：${p.skillPoints||0}\n${lines}\n\n選擇未學習技能即可解鎖。`);let opts=[];tree.forEach(s=>{if(!learned[key+":"+s[0]])opts.push([`學習 ${s[0]}（1 點）`,()=>learnTreeSkill(s[0])])});opts.push(["切換職業",jobMenu],["返回狀態",showStatus]);buttons(opts)}
function learnTreeSkill(name){const key=p.jobKey||"knight",s=SKILL_TREES[key].find(x=>x[0]===name);if(!s)return;if((p.skillPoints||0)<1){say("技能點數不足！升級可以獲得技能點數。");buttons([["返回技能樹",skillMenu]]);return}p.skillPoints--;p.learnedSkills=p.learnedSkills||{};p.learnedSkills[key+":"+name]=true;if(s[1]==="passive")refreshEquip();addLog("習得技能："+name);hud();skillMenu()}
function learnPassive(){const key=p.jobKey||"knight",name=JOBS[key].passive;if((p.skillPoints||0)<1){say("技能點數不足！升級可以獲得技能點數。");buttons([["返回技能樹",skillMenu]]);return}p.learnedPassives=p.learnedPassives||{};if(p.learnedPassives[key]){skillMenu();return}p.skillPoints--;p.learnedPassives[key]=true;addLog("習得被動："+name);hud();skillMenu()}
function useTreeSkill(name){if(!inBattle||turn!=="player")return;const key=p.jobKey||"knight",s=SKILL_TREES[key].find(x=>x[0]===name);if(!s||!p.learnedSkills[key+":"+name])return;if(p.mp<s[2]){say("MP 不足！");return}p.mp-=s[2];let msg="";if(["治癒術","神聖之光","復甦之雨","天使降臨"].includes(name)){const amount=Math.round(p.maxHp*s[3]);const h=Math.min(amount,p.maxHp-p.hp);p.hp+=h;msg=`恢復 ${h} HP！`}else if(["守護姿態","挑釁","盾牆","魔力護盾","煙幕","架勢","戰吼","守護精靈","祝福","祈禱","聖域"].includes(name)){msg="進入防護／增益姿態，本回合降低受到的傷害！";say(`波波施展「${name}」！${msg}`);addLog(name+"：防護姿態");hud();enemyTurn(true);return}else{const d=Math.max(1,Math.round(effectiveAtk()*s[3]+Math.random()*4));enemy.hp-=d;msg=`造成 ${d} 點傷害！`}say(`波波施展「${name}」！${msg}`);addLog(`${name}：${msg}`);hud();if(enemy.hp<=0){victory();return}enemyTurn(false)}
function saveGame(){localStorage.setItem("pigHeroSave",JSON.stringify({p,quest,won,log}));say("進度已儲存在這台裝置的瀏覽器中！");addLog("已儲存進度")}
function loadGame(){let s=localStorage.getItem("pigHeroSave");if(!s){say("找不到存檔。");return}let d=JSON.parse(s);p=d.p;quest=d.quest;won=d.won;log=d.log||[];if(!p.jobKey)p.jobKey="knight";if(p.skillPoints==null)p.skillPoints=0;if(!p.learnedPassives)p.learnedPassives={};if(!p.learnedSkills)p.learnedSkills={};if(!p.promotionKey)p.promotionKey=null;ensureEq();applyJob(p.jobKey);inBattle=false;turn="player";enemy=null;$("scene").classList.remove("battle");$("enemy")?.remove();$("hero").textContent="🐷";hud();say("讀檔成功！歡迎回來，波波。");buttons([["繼續探索",explore],["回村",village]])}
function resetGame(){if(!confirm("確定要重新開始？目前進度會清除。"))return;localStorage.removeItem("pigHeroSave");p={name:"波波",job:"見習勇者",lv:1,xp:0,next:20,hp:40,maxHp:40,mp:12,maxMp:12,atk:8,def:3,gold:0,potions:2,jobKey:"knight",skillPoints:0,learnedPassives:{},learnedSkills:{},promotionKey:null,inv:[],equip:{weapon:null,armor:null,acc:null},iid:0};applyJob("knight",true);enemy=null;inBattle=false;quest=false;won=false;log=[];$("scene").classList.remove("battle");$("enemy")?.remove();$("hero").textContent="🐷";hud();village()}
hud();buttons([["和村長交談",talk],["前往村外探索",explore],["職業選擇",jobMenu],["技能樹",skillMenu],["查看角色狀態",showStatus]]);
</script></body></html>
