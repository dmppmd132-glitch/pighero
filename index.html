<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f4d6a5"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="豬豬勇者"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>豬豬勇者傳說｜第八階段正式版</title>
<link rel="stylesheet" href="styles.css"><script src="js/compat.js"></script></head>
<body><div id="game">
<header><h1>🐷 豬豬勇者傳說</h1><span class="tag">第八階段・正式遊戲化</span><button id="muteBtn" class="secondary" onclick="g8mute()" aria-label="音效開關" style="padding:5px 10px">🔊</button></header>
<div id="hud"></div>
<main>
<section id="scene" class="map-scene" aria-label="16-bit 像素冒險地圖">
<div class="caption" id="location">波波新手村</div>
<div class="map-canvas" id="mapCanvas">
  <div class="map-cloud cloud-a"></div><div class="map-cloud cloud-b"></div>
  <div class="map-river"></div><div class="map-bridge bridge-n" aria-hidden="true"></div><div class="map-bridge bridge-s" aria-hidden="true"></div><div class="map-path path-a"></div><div class="map-path path-b"></div>
  <div class="map-square"><div class="map-fountain">⛲</div></div>
  <div class="map-fence fence-n"></div><div class="map-fence fence-e"></div><div class="map-fence fence-s"></div>
  <div class="map-house house-nw">🏠<span>村長家</span></div><div class="map-house house-ne">🏠<span>旅店</span></div>
  <div class="map-house house-sw">🏡<span>小木屋</span></div><div class="map-house house-se">🏠<span>古老石碑</span></div>
  <div class="map-tree tree-n">🌳</div><div class="map-tree tree-e">🌳</div><div class="map-tree tree-s">🌲</div><div class="map-tree tree-w">🌳</div>
  <div class="map-bush bush-n">🌿🌿</div><div class="map-bush bush-s">🌿🌿🌿</div><div class="map-bush bush-e">🌿🌿</div>
  <div class="map-flower flowers-w">✿　✿<br>　✿</div><div class="map-flower flowers-e">✿ ✿<br>　✿</div>
  <div class="map-bench bench-w">▰</div><div class="map-bench bench-e">▰</div><div class="map-sign sign-s">▤</div>
  <button class="map-node village-node" onclick="walkMapTo('mayor')" aria-label="和村長交談"><span class="node-art">🏡</span><span class="node-label">村長家</span></button>
  <button class="map-node shop-node" onclick="walkMapTo('shop')" aria-label="前往商店"><span class="node-art">🏪</span><span class="node-label">雜貨店</span></button>
  <button class="map-node forest-node" onclick="mapMove(2)" aria-label="前往野花森林"><span class="node-art">🌳</span><span class="node-label">野花森林</span></button>
  <button class="map-node field-node" onclick="mapMove(1)" aria-label="前往草原小徑"><span class="node-art">🌾</span><span class="node-label">草原小徑</span></button>
  <button class="map-node stone-node" onclick="mapMove(3)" aria-label="前往遺跡"><span class="node-art">🪨</span><span class="node-label">遺跡</span></button>
  <button class="map-npc npc-a" onclick="mapTalk('gardener')" aria-label="和園丁對話">🧑‍🌾<small>園丁</small></button>
  <button class="map-npc npc-b" onclick="mapTalk('traveler')" aria-label="和旅人對話">🧙<small>旅人</small></button>
  <button class="map-player hero facing-down" id="hero" onclick="mapTalk('player')" aria-label="波波目前位置"></button>
  <button class="town-interact" onclick="interactNearby()" aria-label="互動">A</button>
  <div class="town-hint">點擊地圖移動　A 互動</div>
</div>
</section>
<section class="panel"><div id="message">歡迎來到波波新手村！村長似乎有事情想拜託你。先和村長聊聊，開始你的冒險吧！</div>
<div id="actions" class="actions"></div><div id="log"></div></section>
</main>
<section id="tabPanel" class="tab-panel" aria-label="功能分頁內容"></section>
<footer id="tabbar" class="tabbar" aria-label="主要分頁導覽">
  <button class="tab-button active" data-tab="adventure" onclick="switchTab('adventure')"><span>🧭</span>冒險</button>
  <button class="tab-button" data-tab="status" onclick="switchTab('status')"><span>🛡️</span>狀態</button>
  <button class="tab-button" data-tab="quests" onclick="switchTab('quests')"><span>📜</span>任務</button>
  <button class="tab-button" data-tab="settings" onclick="switchTab('settings')"><span>⚙️</span>設定</button>
</footer>
</div>

<script src="js/game-core.js"></script>
<script src="js/equipment.js"></script>
<script src="js/battle.js"></script>
<script src="js/party.js"></script>
<script src="js/world.js"></script>
<script src="js/story.js"></script>
<script src="js/state.js"></script>
<script src="js/platform.js"></script>
<script src="js/ui-panels.js"></script>
<script src="js/navigation.js"></script>
<script src="js/bootstrap.js"></script></html>
