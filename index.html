<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f4d6a5"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="豬豬勇者"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>豬豬勇者傳說｜第八階段正式版</title>

<body><div id="game">
<header><h1>🐷 豬豬勇者傳說</h1><span class="tag">第八階段・正式遊戲化</span><button id="muteBtn" class="secondary" onclick="g8mute()" aria-label="音效開關" style="padding:5px 10px">🔊</button></header>
<div id="hud"></div>
<main>
<section id="scene"><div class="caption" id="location">波波新手村</div><div class="hill"></div><div class="tree a">🌳</div><div class="tree b">🌲</div><div class="village">🏡</div><div class="hero" id="hero">🐷</div></section>
<section class="panel"><div id="message">歡迎來到波波新手村！村長似乎有事情想拜託你。先和村長聊聊，開始你的冒險吧！</div>
<div id="actions" class="actions"></div><div id="log"></div></section>
</main>
<footer><button class="secondary" onclick="talk()">💬 和村長交談</button><button class="secondary" onclick="explore()">🌿 前往村外探索</button><button class="secondary" onclick="showStatus()">📜 角色狀態</button><button class="secondary" onclick="jobMenu()">🛡️ 職業選擇</button><button class="secondary" onclick="skillMenu()">✨ 技能樹</button><button class="secondary" onclick="storyLog()">📖 主線劇情</button><button class="secondary" onclick="questLog()">📜 任務日誌</button><button class="secondary" onclick="teamMenu()">🐷 夥伴與寵物</button><button class="secondary" onclick="areaMenu()">🗺️ 地圖與BOSS</button><button class="secondary" onclick="equipMenu()">⚔️ 裝備背包</button><button class="secondary" onclick="shopMenu()">🏪 商店</button><button class="secondary" onclick="saveGame()">💾 儲存進度</button><button class="secondary" onclick="loadGame()">📂 載入進度</button><button class="secondary" onclick="g8Settings()">⚙️ 設定</button><button class="danger" onclick="resetGame()">重新開始</button></footer>
</div>
